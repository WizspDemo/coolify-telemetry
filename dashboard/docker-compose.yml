services:
  dashboard:
    build: .
    image: ghcr.io/OWNER/coolify-telemetry-dashboard:latest
    container_name: coolify-telemetry-dashboard
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /app/data
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      SERVERS: ${SERVERS}
    volumes:
      - dashboard-data:/app/data
    ports:
      - "8080"

volumes:
  dashboard-data:
